<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我捡到的手机</title>

  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/lock.css">
  <link rel="stylesheet" href="./css/desktop.css">
  <link rel="stylesheet" href="./css/kakao.css">
  <link rel="stylesheet" href="./css/instagram.css">
</head>

<body>
  <div class="lock-screen">
    <div class="status-bar">
      <div class="status-left">
       <span>KT</span>

      </div>

      <div class="status-right">
       <div class="signal" aria-label="满格信号">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
       </div>

       <span>5G</span>
       <div class="battery" aria-label="电量充足"></div>
     </div>
   </div>
    <!-- 解锁后的桌面 -->
    <div class="desktop" id="desktop" hidden>
  <!-- 保留主线标记，暂时不显示 -->
  <div id="story-name" hidden></div>

  <div class="desktop-content" id="desktop-content">

    <!-- 顶部小组件 -->
    <div class="widget-row">
      <div class="widget weather-widget">
        <div class="widget-city">首尔</div>
        <div class="widget-temperature">18°</div>
        <div class="widget-weather">☁ 多云</div>
        <div class="widget-detail">最高 20° 最低 12°</div>
      </div>

      <div class="widget calendar-widget">
        <div class="widget-week" id="widget-week"></div>
        <div class="widget-day" id="widget-day"></div>
        <div class="widget-event">今天暂无日程</div>
      </div>
    </div>

        <!-- 文件夹由 js/desktop.js 自动生成 -->
    <div class="app-grid folder-grid" id="folder-grid"></div>
  </div>
  <!-- 上面只关闭 desktop-content，桌面还没有结束 -->


  <!-- 暂时保留，方便测试两组密码 -->
  <button type="button" class="lock-button" id="lock-button">
    返回锁屏
  </button>

  <!-- 底部固定栏 -->
  <div class="dock">
  <button class="app" type="button"
          data-app="phone" aria-label="电话">
    <img class="app-icon app-image"
         src="./assets/icons/phone.PNG" alt=""
         draggable="false">
  </button>

  <button class="app" type="button"
          data-app="messages" aria-label="信息">
    <img class="app-icon app-image"
         src="./assets/icons/messages.PNG" alt=""
         draggable="false">
  </button>

  <button class="app" type="button"
          data-app="kakao" aria-label="KakaoTalk">
    <img class="app-icon app-image"
         src="./assets/icons/kakao.PNG" alt=""
         draggable="false">
  </button>

  <button class="app" type="button"
          data-app="music" aria-label="音乐">
    <img class="app-icon app-image"
         src="./assets/icons/music.PNG" alt=""
         draggable="false">
  </button>
</div>

  <div class="desktop-bar"></div>
  <!-- 展开的文件夹 -->
<div class="folder-overlay" id="folder-overlay" hidden>
  <div class="folder-dialog"
       role="dialog"
       aria-modal="true"
       aria-labelledby="folder-title">

    <h2 id="folder-title"></h2>

    <div class="folder-panel">
      <div class="folder-apps" id="folder-apps"></div>
    </div>

    <button type="button"
            class="folder-close"
            id="folder-close">
      关闭
    </button>
  </div>
</div>
</div>
    <!-- KakaoTalk -->
    <section class="kakao-app" id="kakao-app"
             aria-label="KakaoTalk" hidden>

       <header class="kakao-header">
         <h1 id="kakao-title">聊天</h1>

         <div class="kakao-header-actions">
           <button type="button" id="kakao-search"
              aria-label="搜索">
             <svg viewBox="0 0 24 24" aria-hidden="true">
               <circle cx="10.5" cy="10.5" r="6.5"></circle>
               <path d="m16 16 5 5"></path>
             </svg>
           </button>

           <!-- 根据当前页面生成不同按钮 -->
           <div class="kakao-page-actions" id="kakao-page-actions"></div>
           <button type="button" id="kakao-exit"
                   aria-label="返回桌面">
               <svg viewBox="0 0 24 24" aria-hidden="true">
                 <path d="m14 5-7 7 7 7"></path>
               </svg>
           </button>
         </div>
       </header>
<!-- 仅在聊天详情中显示 -->
<header class="kakao-conversation-header">
  <button type="button"
          class="kakao-conversation-back"
          id="kakao-conversation-back"
          aria-label="返回聊天列表">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="m15 4-8 8 8 8"></path>
    </svg>

    <span id="kakao-total-unread"></span>
  </button>

  <strong class="kakao-conversation-title"
          id="kakao-conversation-title"></strong>

  <div class="kakao-conversation-tools">
    <button type="button"
        id="kakao-conversation-search"
        aria-label="搜索聊天记录">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="10" cy="10" r="7"></circle>
        <path d="m15 15 6 6"></path>
      </svg>
    </button>

    <button type="button" aria-label="电话"
            disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m6 3 4 5-3 3a15 15 0 0 0 6 6l3-3
                 5 4-2 3C10 23 1 14 3 5Z"></path>
      </svg>
    </button>

    <button type="button"
        id="kakao-menu-button"
        aria-label="聊天菜单"
        aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 5h16M4 12h16M4 19h16"></path>
      </svg>
    </button>
  </div>
</header>
       <form class="kakao-chat-search"
             id="kakao-chat-search" hidden>

         <input type="search"
                id="kakao-chat-search-input"
                placeholder="搜索聊天记录"
                aria-label="搜索聊天记录"
                autocomplete="off">

         <button type="button" id="kakao-chat-search-close">
           取消
         </button>

  <div class="kakao-search-result"
       id="kakao-search-result"
       aria-live="polite"></div>
</form>
       <main class="kakao-content" id="kakao-content"></main>

       <nav class="kakao-tabs" aria-label="KakaoTalk 导航">

         <button type="button" data-kakao-tab="friends"
                 aria-label="好友" aria-pressed="false">
           <svg viewBox="0 0 24 24" aria-hidden="true">
             <circle cx="12" cy="7" r="4"></circle>
             <path d="M4 21v-2a8 8 0 0 1 16 0v2Z"></path>
           </svg>
         </button>

         <button type="button" data-kakao-tab="chats"
                 aria-label="聊天" aria-pressed="true">
           <svg viewBox="0 0 24 24" aria-hidden="true">
             <path d="M21 11c0 5-4 8-9 8H9l-5 3 1-5
                    a7 7 0 0 1-2-6c0-5 4-8 9-8s9 3 9 8Z">
             </path>
           </svg>
         </button>

         <button type="button" data-kakao-tab="calls"
                 aria-label="通话" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 3 4 5-3 3a15 15 0 0 0 6 6l3-3
                     5 4-2 3C10 23 1 14 3 5Z"></path>
            </svg>
         </button>

         <button type="button" data-kakao-tab="more"
                 aria-label="更多" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="4" cy="12" r="2"></circle>
              <circle cx="12" cy="12" r="2"></circle>
              <circle cx="20" cy="12" r="2"></circle>
            </svg>
         </button>

        </nav>

        <button type="button" class="kakao-home"
                id="kakao-home" aria-label="返回桌面"></button>
      </section>
    <div class="date" id="date"></div>
    <div class="time" id="time"></div>

    <div class="bottom">
      <div class="home-bar"></div>
    </div>
    <!-- 密码界面：放在 lock-screen 内部 -->
    <div class="passcode-screen" id="passcode-screen" hidden>
      <div class="passcode-content">
        <h2 id="passcode-title">输入密码</h2>

        <div class="passcode-dots" id="passcode-dots">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>

        <p class="passcode-error" id="passcode-error"
           aria-live="polite"></p>

        <div class="keypad" id="keypad">
          <button type="button" data-digit="1">1<small>&nbsp;</small></button>
          <button type="button" data-digit="2">2<small>ABC</small></button>
          <button type="button" data-digit="3">3<small>DEF</small></button>
          <button type="button" data-digit="4">4<small>GHI</small></button>
          <button type="button" data-digit="5">5<small>JKL</small></button>
          <button type="button" data-digit="6">6<small>MNO</small></button>
          <button type="button" data-digit="7">7<small>PQRS</small></button>
          <button type="button" data-digit="8">8<small>TUV</small></button>
          <button type="button" data-digit="9">9<small>WXYZ</small></button>
          <div></div>
          <button type="button" data-digit="0">0<small>&nbsp;</small></button>
          <div></div>
        </div>

        <div class="passcode-actions">
          <button type="button" id="cancel-passcode">取消</button>
          <button type="button" id="delete-digit">删除</button>
        </div>
      </div>
    </div>
  </div>
<script src="./js/main.js"></script>
<script src="./js/desktop.js"></script>
<script src="./js/phone-countries.js"></script>
<script src="js/kakao-story.js"></script>
<script src="./js/kakao.js"></script>
<script src="./js/instagram-posts.js?v=20261109-2"></script>
<script src="./js/instagram.js"></script>
</body>
</html>
